<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Edit Student — {{ student.full_name }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        body { background: #f5f6fa; padding: 40px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { max-width: 750px; margin: 0 auto; border-radius: 12px; border: none; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .card-header { background: #007bff; color: white; border-radius: 12px 12px 0 0 !important; padding: 20px; text-align: center; }
        .card-header h3 { margin: 0; font-size: 22px; text-transform: uppercase; letter-spacing: 1px;}
        .card-header p { margin: 5px 0 0; font-size: 14px; opacity: 0.9; }
        .card-body { padding: 30px; }
        label { font-weight: 600; color: #34495e; margin-bottom: 5px; }
        .form-control, .form-select { border-radius: 8px; padding: 10px 14px; }
        .form-control:focus, .form-select:focus { border-color: #007bff; box-shadow: 0 0 5px rgba(0,123,255,0.3); }
        .btn-save { background: #007bff; color: white; font-weight: bold; width: 100%; padding: 12px; border-radius: 8px; border: none; transition: 0.3s; }
        .btn-save:hover { background: #0056b3; }
        .back-link { display: inline-block; margin-top: 15px; color: #007bff; text-decoration: none; font-weight: 500; }
        .back-link:hover { color: #0056b3; }
    </style>
</head>
<body>

<div class="card">
    <div class="card-header">
        <h3>AcademiaPro</h3>
        <p>Edit Student Record</p>
    </div>
    <div class="card-body">

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, msg in messages %}
                <div class="alert alert-{{ category }}">{{ msg }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST">
            
            <div class="row mb-3">
                <div class="col-md-6">
                    <label>Full Name</label>
                    <input type="text" name="full_name" class="form-control" value="{{ student.full_name }}" required>
                </div>
                <div class="col-md-6">
                    <label>Admission Number</label>
                    <input type="text" name="admission_number" class="form-control" value="{{ student.admission_number }}" required>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label>Phone Number</label>
                    <input type="text" name="phone_number" class="form-control" value="{{ student.phone_number or '' }}">
                </div>
                <div class="col-md-6">
                    <label>Course</label>
                    <select name="course_id" id="courseSelect" class="form-select" required>
                        <option value="">— Select Course —</option>
                        {% for c in courses %}
                            <option value="{{ c.id }}" {% if student.course_id == c.id %}selected{% endif %}>
                                {{ c.name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="row mb-4">
                <div class="col-md-6">
                    <label>Semester (Optional)</label>
                    <select name="semester_id" id="semesterSelect" class="form-select">
                        <option value="">— None —</option>
                        {% for s in semesters %}
                            <option value="{{ s.id }}" data-course="{{ s.course_id }}" {% if student.current_semester_id == s.id %}selected{% endif %}>
                                {{ s.name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label>Module (Optional)</label>
                    <select name="module_id" id="moduleSelect" class="form-select">
                        <option value="">— None —</option>
                        {% for m in modules %}
                            <option value="{{ m.id }}" data-course="{{ m.course_id }}" {% if student.module_id == m.id %}selected{% endif %}>
                                {{ m.name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="mt-4">
                <button type="submit" class="btn-save">💾 Save Changes</button>
                <div class="text-center">
                    <a href="{{ back_url }}" class="back-link">← Back to List</a>
                </div>
            </div>
        </form>
    </div>
</div>

<script>
    // Filter Semesters and Modules based on Selected Course
    const courseSelect = document.getElementById('courseSelect');
    const semesterSelect = document.getElementById('semesterSelect');
    const moduleSelect = document.getElementById('moduleSelect');

    function filterDropdowns() {
        const selectedCourseId = courseSelect.value;

        // Filter Semesters
        Array.from(semesterSelect.options).forEach(opt => {
            if (opt.value === "") return;
            if (opt.dataset.course === selectedCourseId) {
                opt.style.display = '';
            } else {
                opt.style.display = 'none';
                if (opt.selected) opt.selected = false;
            }
        });

        // Filter Modules
        Array.from(moduleSelect.options).forEach(opt => {
            if (opt.value === "") return;
            if (opt.dataset.course === selectedCourseId) {
                opt.style.display = '';
            } else {
                opt.style.display = 'none';
                if (opt.selected) opt.selected = false;
            }
        });
    }

    // Run on page load
    filterDropdowns();

    // Run when course changes
    courseSelect.addEventListener('change', filterDropdowns);
</script>

</body>
</html>
